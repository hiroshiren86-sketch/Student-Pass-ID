name = "inas-attendance-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Variables de entorno públicas
[vars]
SCHOOL_CODE = "INAS_2026"
SCHOOL_NAME = "Institución Educativa Antonia Santos"
# NOTA: la IA ya NO se integra en el Worker (se ejecuta local en el navegador, BYOK).
# El secret residual GROQ_API_KEY fue ELIMINADO del dashboard el 01/09/2026 (Ronda 3
# de AGENTS.md). El Worker no declara ningún secret de IA y no debe volver a hacerlo.

# Enlace a Base de Datos Relacional Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "inas_attendance_db"
database_id = "c577c8b3-6f07-4a63-8671-f447871325d6"

# Enlace a Almacenamiento Clave-Valor Cloudflare KV (Caché ultrarrápida <20ms para portería)
[[kv_namespaces]]
binding = "ATTENDANCE_KV"
id = "3b249fb9b0014f918680646a5ae869f6"

# NOTA DE SECRETOS (Configurar vía `wrangler secret put <NOMBRE>`):
# - AUTH_TOKEN : Token secreto de autorización de la institución para conectar terminales
#   (OPCIONAL, decisión pendiente del propietario; hoy el Worker está abierto. Ver AGENTS.md Ronda 3).
# Los secrets de IA quedaron obsoletos con la migración a IA local BYOK: GROQ_API_KEY fue
# borrado del dashboard el 01/09/2026. No recrear secrets de IA bajo ninguna circunstancia.
